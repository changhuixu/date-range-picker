name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Use Node.js latest version 🟢
        uses: actions/setup-node@v5
        with:
          node-version: latest # Or 'current' or 'node'

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build:lib
          npm run build:gh-pages
          cp ./dist/date-range-picker-demo/browser/index.html ./dist/date-range-picker-demo/browser/404.html

      - name: Run e2e tests 🧪
        run: |
          npm run cypress:verify
          npm run cypress:run

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/date-range-picker-demo/browser
